services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: credit-scoring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    expose:
      - "5432" # Internal only
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - credit-scoring-network

  # FastAPI Application (API) - LOCKED DOWN
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-scoring-api
    depends_on:
      postgres:
        condition: service_healthy
    # NO PORTS MAPPED TO HOST - Internal Access Only
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False # Critical for production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - PRECOMPUTED_FEATURES_PATH=data/processed/precomputed_features.parquet
      - MODEL_PATH=models/production_model.onnx # Use ONNX for inference speed
      - RISK_THRESHOLD_LOW=${RISK_THRESHOLD_LOW}
      - RISK_THRESHOLD_MEDIUM=${RISK_THRESHOLD_MEDIUM}
      - RISK_THRESHOLD_HIGH=${RISK_THRESHOLD_HIGH}
      # Restrict CORS to internal Streamlit or specific domains if exposed via Proxy
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8501"]} 
    volumes:
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
      - ./data:/app/data
      - ./models:/app/models
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'
    networks:
      - credit-scoring-network

  # Streamlit Dashboard - THE ONLY ENTRY POINT
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: credit-scoring-streamlit
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${STREAMLIT_PORT:-8501}:8501" # This is the public gate
    environment:
      - API_BASE_URL=http://api:8000 # Internal docker DNS
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'
    networks:
      - credit-scoring-network

  # Optional: Nginx Reverse Proxy (Recommended for SSL/HTTPS)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/conf:/etc/nginx/conf.d
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   depends_on:
  #     - streamlit
  #   networks:
  #     - credit-scoring-network

volumes:
  postgres_data:
    driver: local

networks:
  credit-scoring-network:
    driver: bridge
